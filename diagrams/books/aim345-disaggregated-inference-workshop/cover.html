<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .card{
    width:500px;height:700px;
    position:relative;
    background:
      radial-gradient(140% 90% at 50% 8%, rgba(26,224,150,0.10) 0%, rgba(26,224,150,0) 55%),
      linear-gradient(180deg, #0c1211 0%, #090d0c 55%, #070a09 100%);
    border-radius:0;
    overflow:hidden;
    box-shadow: inset 10px 0 24px rgba(0,0,0,0.55), inset -10px 0 24px rgba(0,0,0,0.55);
    font-family: "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
  }
  .spine-l{position:absolute; left:0; top:0; width:3px; height:100%; background:linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));}
  .vignette{position:absolute; inset:0; box-shadow: inset 0 0 90px rgba(0,0,0,0.55); border-radius:0;}
  .price{
    position:absolute; top:22px; right:22px;
    background:#1b9cf0; color:#ffffff; font-weight:700; font-size:15px;
    padding:5px 12px; border-radius:7px; letter-spacing:0.5px;
  }
  .diagram{position:absolute; top:92px; left:0; width:500px; height:300px;}
  .labels{position:absolute; left:40px; bottom:46px; width:420px;}
  .kicker{
    color:#5fe3b0; font-size:14px; font-weight:700; letter-spacing:3px; margin:0 0 10px 0;
    text-transform:uppercase;
  }
  .title-main{
    color:#f3f6f5; font-size:34px; font-weight:800; line-height:1.28; margin:0;
    letter-spacing:0.5px;
  }
  .title-sub{
    color:#36e39a; font-size:26px; font-weight:800; line-height:1.3; margin:10px 0 0 0;
  }
  .tagline{
    color:#7c8c87; font-size:13px; font-weight:500; margin:18px 0 0 0; letter-spacing:0.5px;
  }
  .rule{
    position:absolute; left:40px; bottom:32px; width:0px; height:1px;
  }
  svg .node{fill:#0d1b17; stroke:#2fe3a0; stroke-width:2.5;}
  svg .node-glow{fill:#2fe3a0; filter: drop-shadow(0 0 6px rgba(47,227,160,0.9));}
  svg .wire{stroke:#1f8f6c; stroke-width:2; fill:none;}
  svg .wire-bright{stroke:#2fe3a0; stroke-width:2.4; fill:none;}
  svg .dim{opacity:0.55;}
  svg text.tag{fill:#8fb9ab; font-size:11px; font-family:"Helvetica Neue", Arial, sans-serif; font-weight:600; letter-spacing:0.5px;}
</style>
</head>
<body>
<div class="card">
  <div class="spine-l"></div>

  <div class="diagram">
    <svg width="500" height="300" viewBox="0 0 500 300">
      <!-- shared input node -->
      <circle class="node node-glow" cx="250" cy="34" r="7"/>
      <line class="wire-bright" x1="250" y1="41" x2="250" y2="70"/>

      <!-- fork -->
      <path class="wire-bright" d="M250,70 C250,92 150,92 150,116"/>
      <path class="wire" d="M250,70 C250,92 350,92 350,116"/>

      <!-- unified branch (left): one engine box doing both roles -->
      <rect class="node" x="104" y="116" width="92" height="46" rx="6"/>
      <text class="tag" x="150" y="144" text-anchor="middle">UNIFIED</text>

      <line class="wire-bright" x1="150" y1="162" x2="150" y2="196"/>
      <circle class="node node-glow" cx="150" cy="206" r="7"/>

      <!-- disaggregated branch (right): two boxes + handoff -->
      <rect class="node dim" x="304" y="116" width="78" height="40" rx="6"/>
      <text class="tag dim" x="343" y="140" text-anchor="middle">PREFILL</text>

      <line class="wire" x1="382" y1="136" x2="412" y2="136"/>
      <circle class="node-glow" cx="412" cy="136" r="3.5"/>
      <text class="tag" x="397" y="124" text-anchor="middle" font-size="9">KV</text>

      <rect class="node" x="356" y="166" width="78" height="40" rx="6"/>
      <text class="tag" x="395" y="190" text-anchor="middle">DECODE</text>

      <line class="wire" x1="343" y1="156" x2="343" y2="166" />
      <path class="wire" d="M343,166 C343,176 356,176 356,186"/>

      <line class="wire-bright" x1="395" y1="206" x2="395" y2="224"/>
      <circle class="node node-glow" cx="395" cy="234" r="7"/>

      <!-- convergence to a shared measurement bar -->
      <path class="wire-bright" d="M150,213 C150,250 230,250 230,264" />
      <path class="wire" d="M395,241 C395,250 270,250 270,264" />
      <rect class="node node-glow" x="196" y="264" width="108" height="12" rx="3" opacity="0.9"/>
      <text class="tag" x="250" y="296" text-anchor="middle" letter-spacing="2">MEASURE · DECIDE</text>
    </svg>
  </div>

  <div class="labels">
    <p class="kicker">AIM345 WORKSHOP</p>
    <p class="title-main">分離推論ワークショップ<br>手順書を読む</p>
    <p class="title-sub">Original × Modified</p>
    <p class="tagline">EKS / prefill-decode / 60 min hands-on</p>
  </div>
</div>
</body>
</html>
