title: "分離推論ワークショップ手順書を読む: Original 版と Modified 版"
summary: "EKS 上で LLM 推論の prefill (入力の下読み) と decode (1 トークンずつの生成) を別エンジンに分ける構成 (分離推論) と、分けない構成 (統合) を 60 分で測って比べる AIM345 ワークショップの手順書を、改善前 (Original) と改善後 (Modified) の両方の版でそのまま読み物にした。最後に両版の差分だけを整理する章を置く。"
